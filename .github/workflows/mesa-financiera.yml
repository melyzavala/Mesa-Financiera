# Mesa Financiera en la nube: funciona con tu computadora apagada.
#  · Cada 15 minutos revisa si escribiste /analiza TICKER en Telegram y responde.
#  · También puedes lanzarlo a mano (incluso desde la app de GitHub en tu celular):
#    Actions → mesa-financiera → Run workflow → escribe el ticker.
name: mesa-financiera

on:
  schedule:
    # Cada 15 minutos, fuera de los minutos más congestionados de GitHub Actions.
    - cron: "7,22,37,52 * * * *"     # hora UTC; GitHub aún puede retrasar alguna ejecución
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar (déjalo vacío para solo revisar Telegram)"
        required: false
        default: ""
      simulacion:
        description: "Modo simulación (sin gastar llaves)"
        type: boolean
        default: false

concurrency:                        # evita dos ejecuciones al mismo tiempo
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MODELO: ${{ vars.MODELO || 'gpt-5.4-mini' }}
      HABILITAR_MODO_REAL: ${{ vars.HABILITAR_MODO_REAL || '1' }}
      MAX_ANALISIS_POR_RUN: ${{ vars.MAX_ANALISIS_POR_RUN || '3' }}
      COOLDOWN_SEGUNDOS: ${{ vars.COOLDOWN_SEGUNDOS || '60' }}
      MODO_SIMULACION: ${{ inputs.simulacion && '1' || '0' }}
      TICKER: ${{ inputs.ticker }}  # se pasa como variable, nunca se pega dentro del comando
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analizar el ticker indicado a mano
        if: github.event_name == 'workflow_dispatch' && env.TICKER != ''
        run: python analizar.py "$TICKER" --telegram

      - name: Revisar mensajes pendientes en Telegram
        run: python revisar_telegram.py

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 14
